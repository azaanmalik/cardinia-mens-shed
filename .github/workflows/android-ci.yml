name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect Android project
        id: source
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ] && [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Android source upload pending; skipping compilation"
          fi
      - name: Install Android SDK Platform 35
        if: steps.source.outputs.present == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate synthetic Firebase configuration for build-only CI
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "cardinia-ci-placeholder",
              "storage_bucket": "cardinia-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                "android_client_info": {
                  "package_name": "com.example.cardiniamensshed"
                }
              },
              "api_key": [{"current_key":"AIzaSyCIPlaceholderNotForRealFirebase0000"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Build debug APK and run unit tests
        if: steps.source.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
